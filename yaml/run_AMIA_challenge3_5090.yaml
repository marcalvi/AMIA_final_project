description: 'AMIA Challenge 3 notebook session on RTX 5090'
executable: /bin/bash
args:
  - -lc
  - |
    set -euo pipefail
    echo "PROJECT_ROOT: ${PROJECT_ROOT}"
    echo "DATA_ROOT: ${DATA_ROOT}"
    echo "CONDA_ENV: ${CONDA_ENV}"
    echo "JUPYTER_PASSWORD: ${JUPYTER_PASSWORD}"
    echo "PUBLIC_KEY: ${PUBLIC_KEY}"

    nvidia-smi || true

    source /home/osiris-user/anaconda3/etc/profile.d/conda.sh
    conda activate "${CONDA_ENV}"

    python - <<'PY'
    import torch
    print("torch", torch.__version__)
    print("cuda available", torch.cuda.is_available())
    print("cuda runtime", torch.version.cuda)
    print("gpu", torch.cuda.get_device_name(0) if torch.cuda.is_available() else "none")
    PY

    python -m ipykernel install --user --name "${KERNEL_NAME}" --display-name "${KERNEL_DISPLAY_NAME}" || true

    cd "${PROJECT_ROOT}"

    export AMIA_PROJECT_DIR="${PROJECT_ROOT}"
    export AMIA_BASE_DIR="${DATA_ROOT}"
    export AMIA_WORKSPACE_DIR="${PROJECT_ROOT}/challenge3_outputs"
    export AMIA_RUN_TRAINING="${AMIA_RUN_TRAINING:-true}"
    export AMIA_RUN_GRID_SEARCH="${AMIA_RUN_GRID_SEARCH:-true}"
    export AMIA_SKIP_FINISHED_RUNS="${AMIA_SKIP_FINISHED_RUNS:-false}"
    export AMIA_YOLO_GRID_EPOCHS="${AMIA_YOLO_GRID_EPOCHS:-80}"
    export AMIA_RTDETR_GRID_EPOCHS="${AMIA_RTDETR_GRID_EPOCHS:-60}"
    export AMIA_FASTER_RCNN_GRID_EPOCHS="${AMIA_FASTER_RCNN_GRID_EPOCHS:-20}"
    export AMIA_ULTRALYTICS_PATIENCE="${AMIA_ULTRALYTICS_PATIENCE:-15}"
    export AMIA_FASTER_RCNN_PATIENCE="${AMIA_FASTER_RCNN_PATIENCE:-5}"
    export AMIA_EVAL_IOU_THRESHOLD="${AMIA_EVAL_IOU_THRESHOLD:-0.4}"
    export AMIA_SUBMISSION_CONF="${AMIA_SUBMISSION_CONF:-0.25}"

    . /start.sh
env:
  PROJECT_ROOT: /home/osiris-user/Desktop/amia_project/AMIA_final_project
  DATA_ROOT: /home/osiris-user/Desktop/amia_project/dataset/challenge_dataset

  CONDA_ENV: AMIA_5090
  KERNEL_NAME: AMIA_5090
  KERNEL_DISPLAY_NAME: AMIA 5090
  JUPYTER_PASSWORD: password123
  PUBLIC_KEY: password123

  AMIA_RUN_TRAINING: 'true'
  AMIA_WORKSPACE_DIR: /home/osiris-user/Desktop/amia_project/AMIA_final_project/challenge3_outputs
  AMIA_RUN_GRID_SEARCH: 'true'
  AMIA_SKIP_FINISHED_RUNS: 'false'
  AMIA_YOLO_GRID_EPOCHS: '80'
  AMIA_RTDETR_GRID_EPOCHS: '60'
  AMIA_FASTER_RCNN_GRID_EPOCHS: '20'
  AMIA_ULTRALYTICS_PATIENCE: '15'
  AMIA_FASTER_RCNN_PATIENCE: '5'
  AMIA_EVAL_IOU_THRESHOLD: '0.4'
  AMIA_SUBMISSION_CONF: '0.25'
worker_type: '5090'
use_gpu: true
max_cpus: 31
max_memory_mb: 110000
docker_image: harbor.vhio.net/geb-env-gpu:0.1.3
mounts: []
max_runtime_minutes: 1440
openports:
  - external: 9999
    internal: 22
  - external: 8888
    internal: 8888
