name: AMIA_5090
channels:
  - http://repo.radiomics.vhio.net:9999/conda/conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - ipykernel
  - jupyterlab
  - notebook
  - numpy>=1.24.0,<2.0
  - pandas>=1.5.0
  - scipy>=1.10.0
  - scikit-learn>=1.2.0
  - matplotlib>=3.7.0
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - nbformat>=5.8.0
  - nbconvert>=7.0.0
  - tensorboard>=2.13.0
  - pip:
      # VHIO RTX 5090 setup: use the same PyTorch CUDA wheel index pattern
      # as the internal cluster environment examples.
      - --index-url http://repo.radiomics.vhio.net:9999/simple/
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - numpy==1.26.4
      - torch
      - torchvision
      - ultralytics-opencv-headless
      - ensemble-boxes
      - torchmetrics
      - faster-coco-eval
      - pycocotools
      - opencv-python-headless==4.10.0.84
      - kaggle
      - pydicom
      - tensorboard
      - seaborn>=0.12.0
      - plotly>=5.15.0
      - pillow>=9.5.0
      - ipywidgets
